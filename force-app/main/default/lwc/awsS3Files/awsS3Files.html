<template>

    <template lwc:if={loading}>
        <lightning-spinner></lightning-spinner>
    </template>

    <div class="container">

        <lightning-layout multiple-rows>

            <template for:each={files} for:item="file">
                <lightning-layout-item key={file.Id}
                    size="12" 
                    small-device-size="12" 
                    medium-device-size="12" 
                    large-device-size="6" 
                    padding="around-small"
                >
                    <div key={file.Id} class="box">
                        <div class="file-item-row">
                            <span class="icon-wrap">   
                                <lightning-icon icon-name={file.icon} size="small"></lightning-icon>
                            </span>
            
                            <span class="files slds-text-body_small">
                                <div class="file-name">{file.File_Name__c}</div>
                                <div class="file-info">{file.File_Info__c}</div>
                            </span>
    
                            <span class="icon-group">
                                <lightning-button-icon 
                                    lwc:if={allowView}
                                    class="view-icon"
                                    name="view"
                                    size="x-small"
                                    onclick={handleView}
                                    data-id={file.Id}
                                    data-key={file.Key__c}
                                    data-title={file.File_Name__c}
                                    data-type={file.Type__c}
                                    icon-name="utility:preview"  
                                    alternative-text="Preview" 
                                    title="Preview"
                                    variant="border-filled" 
                                ></lightning-button-icon>
    
                                <lightning-button-icon 
                                    lwc:if={allowView}
                                    class="view-in-tab-icon"
                                    name="viewInTab"
                                    onclick={handleView}
                                    size="x-small"
                                    data-id={file.Id}
                                    data-key={file.Key__c}
                                    data-title={file.File_Name__c}
                                    data-type={file.Type__c}
                                    icon-name="utility:layout_overlap"  
                                    alternative-text="Preview in tab" 
                                    title="Preview in tab"
                                    variant="border-filled" 
                                ></lightning-button-icon>
    
                                <lightning-button-icon 
                                    lwc:if={allowDelete}
                                    class="delete-icon"
                                    onclick={handleDelete}
                                    size="x-small"
                                    data-id={file.Id}
                                    data-key={file.Key__c}
                                    icon-name="utility:delete"  
                                    alternative-text="Delete" 
                                    title="Delete"
                                    variant="border-filled" 
                                ></lightning-button-icon>
                            </span>
                        </div>
                
                    </div>
                </lightning-layout-item>
                
            </template>
        </lightning-layout>
    </div>
    
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="medium"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <iframe src={doc} width="100%"></iframe>
                </div>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
